services:
  - type: web
    name: notes-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notes-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "30"
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: notes-db
    plan: free
    databaseName: notes_db
    user: notes_user
